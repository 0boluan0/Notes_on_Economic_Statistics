<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>逐图审查 · 可视化实验室</title><link rel="stylesheet" href="../assets/style.css"><style>body{padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:22px;margin:0}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.plot{margin:0;box-shadow:none}#meta{font-size:13px;margin:8px 0 16px}.chart-tooltip{position:absolute}#subject{display:none}button{min-height:34px}.caption{font-size:13px;line-height:1.5}#review{font-size:14px;margin-top:18px}.status{font-family:monospace;font-size:13px}@media(max-width:800px){.gallery{grid-template-columns:1fr}}</style></head><body><header><h1 id="title">载入审查图…</h1><nav><button id="previous">← 上一个</button> <select id="select" aria-label="审查实验"></select> <button id="next">下一个 →</button></nav></header><p><label>审查情境 <select id="preset" aria-label="审查情境"><option value="-1">默认</option></select></label></p><p id="meta"></p><div id="figures" class="gallery"></div><div id="review"></div><p id="status" class="status"></p><iframe id="subject" src="../实验室.html"></iframe><script>
const subject=document.getElementById('subject');let ids=[],index=0,lastId='';const colors=['#17614d','#ba5729','#2e6eaa','#995074','#697627','#6c56a0','#a3aaa0','#38878b'];
function draw(){const w=subject.contentWindow,id=ids[index],c=w.LabContent[id];if(id!==lastId){document.getElementById('preset').innerHTML='<option value="-1">默认</option>'+c.presets.map((p,i)=>'<option value="'+i+'">'+p.label+'</option>').join('');lastId=id;}const pi=Number(document.getElementById('preset').value),p={...Object.fromEntries(c.controls.map(x=>[x.key,x.value])),...(c.presets[pi]?.params||{})},r=w.LabMath.compute(id,p);document.getElementById('title').textContent=c.title;document.title=id+' · 逐图审查';document.getElementById('meta').textContent=c.question+' | '+JSON.stringify(p);document.getElementById('select').value=id;document.getElementById('figures').innerHTML=r.plots.map((q,i)=>'<figure class="plot"><h2>'+q.title+'</h2><div class="chart-wrap" id="review-'+i+'"></div><figcaption class="caption">'+q.series.filter(s=>s.label).map(s=>'<span style="color:'+colors[(s.color||0)%colors.length]+'">●</span> '+s.label+(s.zDomain?' ['+s.zDomain.map(x=>w.VisualLab.number(x)).join(', ')+']':'')).join(' · ')+'</figcaption></figure>').join('');r.plots.forEach((q,i)=>w.VisualLab.drawChart(document.getElementById('review-'+i),q,i));document.getElementById('review').textContent=r.notes.join(' ');document.getElementById('status').textContent=(index+1)+' / '+ids.length+' · '+r.plots.length+' figures rendered';history.replaceState(null,'','#'+id);}
document.getElementById('preset').onchange=draw;subject.addEventListener('load',()=>{ids=Object.keys(subject.contentWindow.LabContent);document.getElementById('select').innerHTML=ids.map(id=>'<option value="'+id+'">'+id+'</option>').join('');index=Math.max(0,ids.indexOf(location.hash.slice(1)));draw();});document.getElementById('next').onclick=()=>{index=(index+1)%ids.length;draw()};document.getElementById('previous').onclick=()=>{index=(index+ids.length-1)%ids.length;draw()};document.getElementById('select').onchange=e=>{index=ids.indexOf(e.target.value);draw()};
</script></body></html>
