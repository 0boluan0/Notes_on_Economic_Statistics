const years=[2017,2018,2019,2020,2021,2022,2023,2024,2025,2026];
const X0=260, YEAR_W=340, Y0=122, LANE_H=132;
const roadmap=document.getElementById('roadmap'), paths=document.getElementById('paths'), yearsEl=document.getElementById('years');
const routeSelect=document.getElementById('route'), yearSelect=document.getElementById('year'), q=document.getElementById('q'), legend=document.getElementById('legend');
const panel=document.getElementById('panel');
function xFor(p){return X0+(p.year-2017)*YEAR_W+Math.min(p.offset||0,5)*42}
function yFor(p){return Y0+data.routes.indexOf(p.routes[0])*LANE_H+LANE_H/2}
for(const y of years){const x=X0+(y-2017)*YEAR_W; yearsEl.insertAdjacentHTML('beforeend',`<div class="year" style="left:${x-220}px">${y}</div>`); roadmap.insertAdjacentHTML('beforeend',`<div class="gridline" style="left:${x}px"></div>`); yearSelect.insertAdjacentHTML('beforeend',`<option>${y}</option>`);}
for(const [i,r] of data.routes.entries()){const color=data.colors[r]; routeSelect.insertAdjacentHTML('beforeend',`<option>${r}</option>`); legend.insertAdjacentHTML('beforeend',`<button data-route="${r}" style="border-left:5px solid ${color}">${r}</button>`); roadmap.insertAdjacentHTML('beforeend',`<div class="lane" style="top:${Y0+i*LANE_H}px"><div class="lane-label" style="color:${color}">${r}<small>${data.papers.filter(p=>p.routes.includes(r)).length} papers</small></div></div>`);}
for(const [i,p] of data.papers.entries()){const color=data.colors[p.routes[0]]; const x=xFor(p), y=yFor(p); const node=document.createElement('button'); node.className='node'+(p.milestone?' milestone':''); node.style.left=x+'px'; node.style.top=y+'px'; node.style.background=color; node.dataset.i=i; node.title=p.title; roadmap.appendChild(node); if(p.milestone){const label=document.createElement('div'); label.className='label'; label.dataset.i=i; label.style.left=x+'px'; label.style.top=y+'px'; label.style.borderLeftColor=color; label.innerHTML=`<b>${p.title.length>58?p.title.slice(0,55)+'...':p.title}</b><span>${p.year} · ${p.routes[0]}</span>`; roadmap.appendChild(label);}}
function drawEdges(){paths.innerHTML=''; for(const [a,b] of data.edges){const pa=data.papers[a], pb=data.papers[b]; const x1=xFor(pa), y1=yFor(pa), x2=xFor(pb), y2=yFor(pb); const mid=(x1+x2)/2; const path=document.createElementNS('http://www.w3.org/2000/svg','path'); path.setAttribute('d',`M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`); path.dataset.a=a; path.dataset.b=b; paths.appendChild(path);}
}
drawEdges();
function show(i){const p=data.papers[i]; document.getElementById('ptitle').textContent=p.title; document.getElementById('pmeta').textContent=`${p.year} · ${p.collection} · ${p.key}`; document.getElementById('proutes').textContent=p.routes.join(' · '); document.getElementById('note').href='papers/'+encodeURIComponent(p.note_file); document.getElementById('zotero').href=p.zotero_item; document.getElementById('pdf').href=p.zotero_pdf; panel.classList.add('open');}
roadmap.addEventListener('click',e=>{const n=e.target.closest('.node'); if(n)show(n.dataset.i);}); document.getElementById('close').onclick=()=>panel.classList.remove('open');
function apply(){const text=q.value.toLowerCase(), route=routeSelect.value, year=yearSelect.value; const visible=data.papers.map(p=>(!text||(p.title+' '+p.key).toLowerCase().includes(text))&&(!route||p.routes.includes(route))&&(!year||String(p.year)===year)); document.querySelectorAll('.node,.label').forEach(el=>{const ok=visible[Number(el.dataset.i)]; el.classList.toggle('dim',!ok);}); document.querySelectorAll('.paths path').forEach(el=>{el.classList.toggle('dim',!(visible[Number(el.dataset.a)]&&visible[Number(el.dataset.b)]));}); document.querySelectorAll('.legend button').forEach(b=>b.classList.toggle('active', b.dataset.route===route));}
q.addEventListener('input',apply); routeSelect.addEventListener('input',apply); yearSelect.addEventListener('input',apply); legend.addEventListener('click',e=>{const b=e.target.closest('button'); if(!b)return; routeSelect.value=routeSelect.value===b.dataset.route?'':b.dataset.route; apply();}); document.getElementById('reset').onclick=()=>{q.value=''; routeSelect.value=''; yearSelect.value=''; apply();};
</script>
