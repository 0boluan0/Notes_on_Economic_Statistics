  <line x1="110" y1="380" x2="110" y2="70" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="70" y1="340" x2="700" y2="340" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="110" y1="340" x2="610" y2="160" stroke="#0f766e" stroke-width="6" marker-end="url(#arrow)"/>
