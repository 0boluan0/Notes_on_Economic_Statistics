<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="760" height="430" fill="#f8fafc"/>
  <line x1="90" y1="360" x2="660" y2="360" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="110" y1="380" x2="110" y2="70" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="110" y1="360" x2="590" y2="130" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="110" y1="360" x2="480" y2="182" stroke="#dc2626" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="480" y1="182" x2="590" y2="130" stroke="#0f766e" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="472" y1="198" x2="524" y2="98" stroke="#94a3b8" stroke-width="3"/>
  <line x1="486" y1="204" x2="538" y2="104" stroke="#94a3b8" stroke-width="3"/>
  <text x="575" y="126" font-size="22" fill="#2563eb" font-family="Helvetica, Arial, sans-serif">b</text>
  <text x="440" y="182" font-size="22" fill="#dc2626" font-family="Helvetica, Arial, sans-serif">projₐ b</text>
  <text x="600" y="165" font-size="22" fill="#0f766e" font-family="Helvetica, Arial, sans-serif">u₂ = b - projₐ b</text>
  <text x="130" y="80" font-size="20" fill="#475569" font-family="Helvetica, Arial, sans-serif">Gram-Schmidt subtracts the old projection to create a new orthogonal direction</text>
</svg>
