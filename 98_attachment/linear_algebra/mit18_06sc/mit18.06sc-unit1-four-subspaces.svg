<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="980" height="500" fill="#f8fafc"/>
  <rect x="60" y="80" width="360" height="320" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="560" y="80" width="360" height="320" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="240" y="125" text-anchor="middle" font-size="30" fill="#0f172a" font-family="Helvetica, Arial, sans-serif">Input space Rⁿ</text>
  <text x="740" y="125" text-anchor="middle" font-size="30" fill="#0f172a" font-family="Helvetica, Arial, sans-serif">Output space Rᵐ</text>
  <rect x="110" y="170" width="260" height="75" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <rect x="110" y="285" width="260" height="75" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
  <rect x="610" y="170" width="260" height="75" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <rect x="610" y="285" width="260" height="75" rx="14" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  <text x="240" y="212" text-anchor="middle" font-size="28" fill="#1d4ed8" font-family="Helvetica, Arial, sans-serif">Row space C(Aᵀ)</text>
  <text x="240" y="327" text-anchor="middle" font-size="28" fill="#b91c1c" font-family="Helvetica, Arial, sans-serif">Nullspace N(A)</text>
  <text x="740" y="212" text-anchor="middle" font-size="28" fill="#166534" font-family="Helvetica, Arial, sans-serif">Column space C(A)</text>
  <text x="740" y="327" text-anchor="middle" font-size="28" fill="#a16207" font-family="Helvetica, Arial, sans-serif">Left nullspace N(Aᵀ)</text>
  <line x1="370" y1="208" x2="610" y2="208" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="492" y="192" text-anchor="middle" font-size="24" fill="#334155" font-family="Helvetica, Arial, sans-serif">A maps row space to column space</text>
  <line x1="370" y1="322" x2="610" y2="322" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="490" y="350" text-anchor="middle" font-size="24" fill="#475569" font-family="Helvetica, Arial, sans-serif">lost directions become nullspaces</text>
  <line x1="240" y1="245" x2="240" y2="285" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="740" y1="245" x2="740" y2="285" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="275" y="273" font-size="20" fill="#64748b" font-family="Helvetica, Arial, sans-serif">orthogonal</text>
  <text x="775" y="273" font-size="20" fill="#64748b" font-family="Helvetica, Arial, sans-serif">orthogonal</text>
  <text x="490" y="50" text-anchor="middle" font-size="18" fill="#64748b" font-family="Helvetica, Arial, sans-serif">Rank r splits both spaces into visible directions and orthogonal complements</text>
</svg>
